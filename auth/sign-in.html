<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Teacher Login | Library Attendance</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/sign-in.css" />
  </head>

  <body class="bg-light text-dark">
    <main class="h-screen d-flex flex-column items-center justify-center border gap-10">
      <div class="w-1/3">
        <!--  LOGO / BRAND  -->

        <div class="text-center mb-8">
          <a href="../index.html" class="d-inline-flex items-center justify-center">
            <img class="w-64 h-auto" src="../assets/images/logo/britech-logo.png" alt="Britech College Logo" />
          </a>

          <p class="text-xs font-bold text-primary mt-2">BRITECH COLLEGE</p>
          <p class="mt-2 text-sm text-gray">White Rose, Yati, Liloan, Cebu, 6000</p>
          <h1 class="text-32 font-bold mt-2">Library Attendance</h1>
        </div>

        <!--  LOGIN CARD  -->
        <section class="rounded-2xl border-2 border-dark bg-white shadow-lg overflow-hidden">
          <!--  SECURITY NOTICE  -->
          <div class="p-4 border-dark bg-light">
            <p class="text-xs text-warning font-bold">
              <span class="mr-2 fa-solid fa-triangle-exclamation"></span>This portal is restricted to authorized
              teachers.
            </p>
          </div>
          <!-- LOGIN HEADER -->
          <div class="px-8 pt-8 mb-6">
            <p class="text-xs font-bold text-primary">TEACHER ACCESS</p>
            <h2 class="text-24 font-bold mt-2">Welcome Back</h2>
            <p class="text-sm text-gray mt-2">Sign in to manage library attendance records.</p>
          </div>

          <!--  LOGIN FORM  -->
          <form class="mb-3 px-8" action="#" method="post">
            <div class="mb-5">
              <label for="username" class="label">Username</label>
              <input class="mt-2 input" type="text" name="" id="" placeholder="Enter your username" required />
            </div>

            <!-- PASSWORD -->
            <div class="mb-5">
              <div class="d-flex items-center justify-between mb-2">
                <label class="label" for="password">Password</label>
                <a href="#" class="btn-link">Forgot Password?</a>
              </div>

              <input class="input" type="password" name="" id="" placeholder="Enter your password" required />
            </div>

            <!-- REMEMBER ME -->
            <div class="d-flex items-center gap-2 mb-5">
              <input class="checkbox" id="remember" name="remember" type="checkbox" />

              <label for="remember" class="text-sm text-gray"> Remember me </label>
            </div>

            <!-- SIGN IN BUTTON -->
            <div class="w-100">
              <!-- Comment or uncomment this code when using exact button -->
              <!-- <button class="w-100 btn-primary btn-sign-in" type="submit" >Sign In</button> -->
              <a class="w-100 btn-primary btn-sign-in" href="../pages/dashboard.html">Temporary Sign In</a>
            </div>
          </form>

          <!--  BACK TO HOME  -->
          <div class="mx-8 mb-4">
            <a href="../index.html" class="w-100 btn-ghost"
              ><span class="fa-solid fa-arrow-left"></span> Back to Home</a
            >
          </div>
        </section>

        <!--  FOOTER  -->
      </div>
      <p class="text-xs text-gray text-center">© 2026 Library Attendance Monitoring System</p>
    </main>
  </body>
</html>
